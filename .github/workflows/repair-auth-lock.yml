name: Repair Auth Lock

on:
  push:
    branches:
      - infra/remote-runtime-bridge-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/remote-runtime-bridge-v1
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate canonical lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Run complete ZERO regression suite
        run: pnpm test
      - name: Run Web auth tests
        run: pnpm --filter @hnk-verse/web test
      - name: Build Web
        run: pnpm --filter @hnk-verse/web build
      - name: Commit canonical lockfile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "lockfile already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(web): regenerate canonical auth lockfile"
          git push origin HEAD:infra/remote-runtime-bridge-v1
