name: KODE 0.2 Gate

on:
  push:
    branches:
      - feature/mhcm-v0.1
  pull_request:
    branches:
      - feature/mhcm-v0.1
      - main

jobs:
  kode-mhcm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run KODE/MHCM gate
        run: pnpm test:mhcm
