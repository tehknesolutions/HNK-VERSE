name: KODE 0.2 Gate

on:
  push:
    branches:
      - feature/mhcm-v0.1
  pull_request:
    branches:
      - feature/mhcm-v0.1
      - main

jobs:
  kode-compatibility:
    name: KODE-0.1 Frozen Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Frozen baseline compatibility
        run: node --experimental-strip-types scripts/kode-compatibility-suite.ts

  kode-0-2-tooling:
    name: KODE-0.2 Tooling
    runs-on: ubuntu-latest
    needs: kode-compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: KODE-0.2 tooling gate
        run: pnpm test:mhcm

  kode-contract:
    name: KODE Contract Surface
    runs-on: ubuntu-latest
    needs: kode-compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
