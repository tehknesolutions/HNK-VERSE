name: ZERO Runtime Check

on:
  push:
    branches:
      - main
      - 'integration/**'
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/zero-runtime-check.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/zero-runtime-check.yml'
  workflow_dispatch:

jobs:
  zero-runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: HNK-VERSE gate
        run: pnpm check
