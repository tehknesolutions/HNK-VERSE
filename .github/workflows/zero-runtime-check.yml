name: ZERO Runtime Check

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/zero-runtime-check.yml'
  workflow_dispatch:

jobs:
  zero-runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: ZERO runtime + persistence + Web checks
        run: pnpm check
