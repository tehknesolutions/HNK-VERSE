name: ZERO Runtime Check

on:
  push:
    branches:
      - zero/runtime-command-persistence-v1
      - main
  pull_request:
    branches:
      - main

jobs:
  zero-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: ZERO runtime invariants
        run: pnpm test:zero
